name = "hint-prompts-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV 命名空间绑定（部署后需要创建并绑定）
# 执行: wrangler kv:namespace create "PROMPTS_KV"
# 然后将返回的 id 填入下方
[[kv_namespaces]]
binding = "PROMPTS_KV"
id = "your-kv-namespace-id"  # 部署时替换

# 开发环境预览 KV
# 执行: wrangler kv:namespace create "PROMPTS_KV" --preview
# [[kv_namespaces]]
# binding = "PROMPTS_KV"
# id = "your-preview-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

[vars]
ENVIRONMENT = "production"

# 可选：自定义域名
# [routes]
# pattern = "prompts-api.yourdomain.com/*"
# zone_name = "yourdomain.com"
