<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hint 提示词管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .dark .glass {
      background: rgba(30, 41, 59, 0.8);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800">
  <div id="app" class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">🍌 Hint 提示词库</h1>
      <p class="text-gray-600 dark:text-gray-400">管理和分享你的提示词模板</p>
    </header>

    <!-- 统计信息 -->
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="glass rounded-xl p-4 text-center">
        <div id="total-count" class="text-2xl font-bold text-blue-600">-</div>
        <div class="text-sm text-gray-500">提示词总数</div>
      </div>
      <div class="glass rounded-xl p-4 text-center">
        <div id="category-count" class="text-2xl font-bold text-green-600">-</div>
        <div class="text-sm text-gray-500">分类数量</div>
      </div>
      <div class="glass rounded-xl p-4 text-center">
        <div id="version" class="text-2xl font-bold text-purple-600">-</div>
        <div class="text-sm text-gray-500">版本</div>
      </div>
    </div>

    <!-- 添加按钮 -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex gap-2">
        <select id="filter-category" class="glass rounded-lg px-4 py-2 text-sm border-0 focus:ring-2 focus:ring-blue-500">
          <option value="">所有分类</option>
        </select>
        <select id="filter-site" class="glass rounded-lg px-4 py-2 text-sm border-0 focus:ring-2 focus:ring-blue-500">
          <option value="">所有站点</option>
          <option value="*">通用</option>
          <option value="claude.ai">Claude</option>
          <option value="chatgpt.com">ChatGPT</option>
          <option value="gemini.google.com">Gemini</option>
        </select>
      </div>
      <button onclick="openAddModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
        + 添加提示词
      </button>
    </div>

    <!-- 提示词列表 -->
    <div id="prompts-list" class="space-y-4">
      <div class="text-center py-12 text-gray-500">
        <div class="text-4xl mb-2">📭</div>
        <div>加载中...</div>
      </div>
    </div>
  </div>

  <!-- 添加/编辑模态框 -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" onclick="closeModal(event)">
    <div class="glass rounded-2xl p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <h2 id="modal-title" class="text-xl font-bold mb-4 text-gray-800 dark:text-white">添加提示词</h2>

      <form id="prompt-form" class="space-y-4">
        <input type="hidden" id="prompt-id">

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">标题 *</label>
          <input type="text" id="prompt-title" required
            class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="例如：代码审查助手">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">内容 *</label>
          <textarea id="prompt-content" required rows="6"
            class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
            placeholder="请输入提示词内容..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">分类</label>
            <select id="prompt-category"
              class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500">
              <option value="开发">开发</option>
              <option value="写作">写作</option>
              <option value="翻译">翻译</option>
              <option value="AI对话">AI对话</option>
              <option value="分析">分析</option>
              <option value="创意">创意</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">作者</label>
            <input type="text" id="prompt-author"
              class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500"
              placeholder="可选">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">适用站点</label>
          <div class="flex flex-wrap gap-2">
            <label class="flex items-center gap-1 px-3 py-1 bg-gray-100 dark:bg-gray-600 rounded-full text-sm cursor-pointer">
              <input type="checkbox" name="sites" value="*" checked class="rounded"> 全部
            </label>
            <label class="flex items-center gap-1 px-3 py-1 bg-gray-100 dark:bg-gray-600 rounded-full text-sm cursor-pointer">
              <input type="checkbox" name="sites" value="claude.ai" class="rounded"> Claude
            </label>
            <label class="flex items-center gap-1 px-3 py-1 bg-gray-100 dark:bg-gray-600 rounded-full text-sm cursor-pointer">
              <input type="checkbox" name="sites" value="chatgpt.com" class="rounded"> ChatGPT
            </label>
            <label class="flex items-center gap-1 px-3 py-1 bg-gray-100 dark:bg-gray-600 rounded-full text-sm cursor-pointer">
              <input type="checkbox" name="sites" value="gemini.google.com" class="rounded"> Gemini
            </label>
            <label class="flex items-center gap-1 px-3 py-1 bg-gray-100 dark:bg-gray-600 rounded-full text-sm cursor-pointer">
              <input type="checkbox" name="sites" value="chat.deepseek.com" class="rounded"> DeepSeek
            </label>
          </div>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal()"
            class="flex-1 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            取消
          </button>
          <button type="submit"
            class="flex-1 px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-medium transition-colors">
            保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="fixed bottom-4 right-4 glass rounded-lg px-4 py-2 text-sm hidden transform transition-all">
  </div>

  <script>
    // API 配置 - 部署后替换为实际地址
    const API_URL = 'https://hint-prompts-api.your-subdomain.workers.dev';

    let promptsData = { prompts: [], categories: [], version: '0.0.0' };

    // 初始化
    async function init() {
      await loadPrompts();
      setupEventListeners();
    }

    // 加载提示词
    async function loadPrompts() {
      try {
        const response = await fetch(`${API_URL}/api/prompts`);
        if (!response.ok) throw new Error('Failed to fetch');

        promptsData = await response.json();

        updateStats();
        updateCategoryFilter();
        renderPrompts();
      } catch (error) {
        console.error('Load failed:', error);
        showToast('加载失败，请检查 API 地址', 'error');
      }
    }

    // 更新统计
    function updateStats() {
      document.getElementById('total-count').textContent = promptsData.prompts.length;
      document.getElementById('category-count').textContent = promptsData.categories.length;
      document.getElementById('version').textContent = promptsData.version;
    }

    // 更新分类筛选器
    function updateCategoryFilter() {
      const select = document.getElementById('filter-category');
      select.innerHTML = '<option value="">所有分类</option>';
      promptsData.categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    // 渲染提示词列表
    function renderPrompts() {
      const container = document.getElementById('prompts-list');
      const category = document.getElementById('filter-category').value;
      const site = document.getElementById('filter-site').value;

      let filtered = promptsData.prompts;

      if (category) {
        filtered = filtered.filter(p => p.category === category);
      }
      if (site) {
        filtered = filtered.filter(p => p.sites.includes('*') || p.sites.includes(site));
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-500">
            <div class="text-4xl mb-2">📭</div>
            <div>暂无提示词</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(prompt => `
        <div class="glass rounded-xl p-4 hover:shadow-lg transition-shadow">
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-gray-800 dark:text-white">${escapeHtml(prompt.title)}</h3>
            <div class="flex gap-1">
              <button onclick="editPrompt('${prompt.id}')" class="p-1 text-gray-500 hover:text-blue-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              </button>
              <button onclick="deletePrompt('${prompt.id}')" class="p-1 text-gray-500 hover:text-red-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </div>
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-3 line-clamp-2">${escapeHtml(prompt.content.substring(0, 150))}...</p>
          <div class="flex items-center gap-2 text-xs">
            <span class="px-2 py-1 bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 rounded">${escapeHtml(prompt.category)}</span>
            ${prompt.sites.map(s => `<span class="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 rounded">${s === '*' ? '全部' : s}</span>`).join('')}
            <span class="text-gray-400 ml-auto">${prompt.author || '匿名'}</span>
          </div>
        </div>
      `).join('');
    }

    // 事件监听
    function setupEventListeners() {
      document.getElementById('filter-category').addEventListener('change', renderPrompts);
      document.getElementById('filter-site').addEventListener('change', renderPrompts);
      document.getElementById('prompt-form').addEventListener('submit', handleSubmit);
    }

    // 打开添加模态框
    function openAddModal() {
      document.getElementById('modal-title').textContent = '添加提示词';
      document.getElementById('prompt-form').reset();
      document.getElementById('prompt-id').value = '';
      document.querySelector('input[name="sites"][value="*"]').checked = true;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    // 编辑提示词
    function editPrompt(id) {
      const prompt = promptsData.prompts.find(p => p.id === id);
      if (!prompt) return;

      document.getElementById('modal-title').textContent = '编辑提示词';
      document.getElementById('prompt-id').value = prompt.id;
      document.getElementById('prompt-title').value = prompt.title;
      document.getElementById('prompt-content').value = prompt.content;
      document.getElementById('prompt-category').value = prompt.category;
      document.getElementById('prompt-author').value = prompt.author || '';

      // 设置站点复选框
      document.querySelectorAll('input[name="sites"]').forEach(cb => {
        cb.checked = prompt.sites.includes(cb.value);
      });

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    // 关闭模态框
    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    // 处理表单提交
    async function handleSubmit(e) {
      e.preventDefault();

      const id = document.getElementById('prompt-id').value;
      const sites = Array.from(document.querySelectorAll('input[name="sites"]:checked')).map(cb => cb.value);

      const data = {
        title: document.getElementById('prompt-title').value,
        content: document.getElementById('prompt-content').value,
        category: document.getElementById('prompt-category').value,
        author: document.getElementById('prompt-author').value || 'anonymous',
        sites: sites.length > 0 ? sites : ['*']
      };

      try {
        const url = id ? `${API_URL}/api/prompts/${id}` : `${API_URL}/api/prompts`;
        const method = id ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error('Save failed');

        showToast(id ? '更新成功' : '添加成功', 'success');
        closeModal();
        await loadPrompts();
      } catch (error) {
        console.error('Save failed:', error);
        showToast('保存失败', 'error');
      }
    }

    // 删除提示词
    async function deletePrompt(id) {
      if (!confirm('确定要删除这个提示词吗？')) return;

      try {
        const response = await fetch(`${API_URL}/api/prompts/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Delete failed');

        showToast('删除成功', 'success');
        await loadPrompts();
      } catch (error) {
        console.error('Delete failed:', error);
        showToast('删除失败', 'error');
      }
    }

    // Toast 通知
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `fixed bottom-4 right-4 glass rounded-lg px-4 py-2 text-sm transform transition-all ${
        type === 'success' ? 'bg-green-100 text-green-800' :
        type === 'error' ? 'bg-red-100 text-red-800' :
        'bg-blue-100 text-blue-800'
      }`;
      toast.classList.remove('hidden');

      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 启动
    init();
  </script>
</body>
</html>
