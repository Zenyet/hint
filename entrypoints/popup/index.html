<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Default Popup Title</title>
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="./password-toggle.css" />
  </head>
  <body>
    <div id="app">
      <div class="settings-panel">
        <label class="settings-label api-key-label">API Key</label>
        <div class="password-toggle-wrapper">
          <input type="password" class="settings-input api-key-input" placeholder="请输入 API Key" />
          <div class="password-toggle-icon" title="显示/隐藏密码">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>
        <label class="settings-label api-url-label">模型接口地址</label>
        <input type="text" class="settings-input api-url-input" placeholder="可选, 默认 deepseek" />
        <label class="settings-label model-name-label">模型名称</label>
        <input type="text" class="settings-input model-name-input" placeholder="可选, 默认 deepseek-chat" />
        <label class="settings-label custom-prompt-label">自定义提示词</label>
        <textarea class="settings-input custom-prompt-input" placeholder="可选, 留空使用默认提示词" rows="4"></textarea>
        <button class="settings-button save-button">保存</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
